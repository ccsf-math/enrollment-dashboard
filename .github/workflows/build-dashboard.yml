name: Build and deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'refresh_dashboard.py'
      - 'index.html'
      - '.github/workflows/build-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so the live site is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Rebuild index.html from data/
        run: python3 refresh_dashboard.py

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          # The page fetches data/manifest.json and the CSVs at runtime, so the
          # data folder ships alongside it. .DS_Store and Excel lock files don't.
          find data -maxdepth 1 -type f ! -name '.DS_Store' ! -name '~$*' \
            -exec cp {} _site/data/ \;
          echo "$(ls _site/data | wc -l) data files staged"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
